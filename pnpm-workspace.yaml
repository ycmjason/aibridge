# pnpm 11 reads settings from here, not the package.json "pnpm" field.
packages:
  - 'packages/*'

# pnpm downloads and re-execs the pinned version on mismatch. This must live here,
# not as `onFail: download` in package.json: npm 11 reads devEngines too and hard-fails
# (EBADDEVENGINES) on any value outside ignore/warn/error, which broke `npm view` in publish.yml.
pmOnFail: download

catalogMode: strict
cleanupUnusedCatalogs: true

# `allowBuilds` (pnpm >= 10.26) permits a dependency's lifecycle/build scripts.
# lefthook needs its postinstall to fetch the platform binary; esbuild is pulled by vitest/vite.
allowBuilds:
  esbuild: true
  lefthook: true

catalog:
  typescript: ~5.9.2
  '@biomejs/biome': ^2.4.15
  repojj: ^2026.1.35
  '@types/node': ^25.9.2
  lefthook: ^2.1.9
  vitest: ^4.0.0
  tsdown: 0.22.14
  '@stricli/core': 1.3.0
  sharp: ^0.35.3

minimumReleaseAgeExclude:
  - tsdown@0.22.14
