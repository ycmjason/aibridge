name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and Format Check
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: repojj check
        run: pnpm repojj:check
      - name: Run tests
        run: pnpm test
      - name: Build all packages
        run: pnpm build
      - name: Pack smoke and consumer install check
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tsc_bin="$(pwd)/node_modules/.bin/tsc"
          types_node_ver="$(node -p "require('@types/node/package.json').version")"
          for pkg in proc driver-agy driver-grok driver-codex driver-claude cli; do
            dir="packages/$pkg"
            tarball="$(cd "$dir" && pnpm pack --pack-destination "$tmp" | tail -n1)"
            tar -tf "$tarball" | grep -E '/dist/' >/dev/null
            mkdir -p "$tmp/$pkg"
            tar -xzf "$tarball" -C "$tmp/$pkg"
            node -e '
              const fs = require("fs");
              const path = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              const scan = (deps) => Object.values(deps || {}).some((v) =>
                typeof v === "string" && (v.startsWith("workspace:") || v.startsWith("catalog:"))
              );
              if (scan(pkg.dependencies) || scan(pkg.peerDependencies) || scan(pkg.optionalDependencies)) {
                console.error("packed manifest still has workspace:/catalog:", path);
                process.exit(1);
              }
              if (pkg.name === "@aibridge/cli") {
                const bin = (pkg.publishConfig && pkg.publishConfig.bin) || pkg.bin;
                const a = bin && bin.aibridge;
                if (a !== "./dist/cli.mjs") {
                  console.error("cli bin must resolve to ./dist/cli.mjs in packed publish shape, got", a);
                  process.exit(1);
                }
              }
              console.log("ok", pkg.name, pkg.version);
            ' "$tmp/$pkg/package/package.json"
          done

          mkdir -p "$tmp/consumer"
          cd "$tmp/consumer"
          node -e 'fs.writeFileSync("package.json", JSON.stringify({ name: "consumer", type: "module" }));'
          npm install "$tmp"/aibridge-*.tgz
          ./node_modules/.bin/aibridge --version
          ./node_modules/.bin/aibridge --help

          node --input-type=module -e '
            const pkgs = ["proc", "driver-agy", "driver-grok", "driver-codex", "driver-claude", "cli"];
            for (const p of pkgs) {
              await import("@aibridge/" + p);
              console.log("imported @aibridge/" + p);
            }
          '

          cat << 'EOF' > test-consumer.ts
          import { runCaptured } from '@aibridge/proc';
          import { fetchAgyQuota } from '@aibridge/driver-agy';
          import { runGrokPrint } from '@aibridge/driver-grok';
          import { fetchCodexQuota } from '@aibridge/driver-codex';
          import { fetchClaudeQuota } from '@aibridge/driver-claude';
          import { app, runCli } from '@aibridge/cli';

          console.log(runCaptured, fetchAgyQuota, runGrokPrint, fetchCodexQuota, fetchClaudeQuota, app, runCli);
          EOF

          cat << 'EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "types": ["node"],
              "noEmit": true
            },
            "files": ["test-consumer.ts"]
          }
          EOF

          npm install -D "@types/node@$types_node_ver"
          "$tsc_bin" -p tsconfig.json
      - name: Actionlint
        run: |
          bash <(curl --fail -Ls https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC npm provenance
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Publish packages (dependency order)
        run: |
          # First-ever publish of each package CANNOT use OIDC trusted publishing:
          # npm requires the package to already exist before a Trusted Publisher can
          # be configured. Bootstrap once from a logged-in machine:
          #   pnpm publish --access public --no-git-checks
          # from each package dir (order: proc agy grok codex claude cli), then in
          # each package's npmjs.com settings add Trusted Publisher:
          #   repo ycmjason/aibridge, workflow publish.yml
          # Subsequent version bumps on main publish automatically via this job.
          set -euo pipefail
          for pkg in proc driver-agy driver-grok driver-codex driver-claude cli; do
            dir="packages/$pkg"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"

            echo "Checking registry for package $name..."
            set +e
            pkg_info="$(npm view "$name" version --json 2>&1)"
            view_status=$?
            set -e

            if [ $view_status -ne 0 ]; then
              if echo "$pkg_info" | grep -q "E404"; then
                echo "skip $name (never published — manual bootstrap required)"
                continue
              else
                echo "Error checking package $name on npm: $pkg_info"
                exit 1
              fi
            fi

            set +e
            ver_info="$(npm view "$name@$version" version --json 2>&1)"
            ver_status=$?
            set -e

            if [ $ver_status -eq 0 ]; then
              echo "skip $name@$version (already on registry)"
            else
              if echo "$ver_info" | grep -q "E404"; then
                echo "publish $name@$version"
                (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
              else
                echo "Error checking $name@$version on npm: $ver_info"
                exit 1
              fi
            fi
          done
