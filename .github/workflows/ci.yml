name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and Format Check
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: repojj check
        run: pnpm repojj:check
      - name: Run tests
        run: pnpm test
      - name: Skill bundle freshness
        run: |
          pnpm build:skill
          git diff --exit-code skills/
          test -z "$(git status --porcelain skills/)"
          test "$(ls skills/ai-bridge/scripts)" = "cli.mjs"
      - name: Skill artifact is self-contained (Vercel copy model)
        run: |
          tmp="$(mktemp -d)"
          cp -R skills/ai-bridge "$tmp/skill"
          test -f "$tmp/skill/THIRD-PARTY-LICENSES"
          cd "$tmp/skill" && node scripts/cli.mjs --help
      - name: Ban import.meta / __dirname in package sources
        run: |
          if grep -rEn 'import\.meta|__dirname' packages/*/src --include='*.ts' --exclude='*.test.ts'; then
            echo 'import.meta / __dirname break bundled skill semantics; remove them.'
            exit 1
          fi
