name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and Format Check
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: repojj check
        run: pnpm repojj:check
      - name: Run tests
        run: pnpm test
